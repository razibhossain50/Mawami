# Local full stack: Postgres + backend (NestJS) + frontend (Next.js)
#   cp docker.env.example .env   # then fill in real values
#   docker compose up --build
#
# Frontend: http://localhost:3000   API: http://localhost:3001/api   Swagger: http://localhost:3001/api/docs

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-finder}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${DB_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create schema + seed (safe to re-run)
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: mawami-backend
    command: ["node", "dist/database-migration.js"]
    environment: &backend-env
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      DB_NAME: ${DB_NAME:-finder}
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      # Google strategy and R2 upload service refuse to boot without these;
      # placeholders let the stack start, but OAuth / uploads need real values.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-placeholder}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-placeholder}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3001/api/auth/google/callback}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-placeholder}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-placeholder}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-placeholder}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-placeholder}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      NEXT_PUBLIC_R2_BASE_URL: ${NEXT_PUBLIC_R2_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    image: mawami-backend
    restart: unless-stopped
    environment: *backend-env
    ports:
      - "${BE_PUBLISH_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Inlined into the browser bundle: must be reachable from the host browser
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
        NEXT_PUBLIC_R2_BASE_URL: ${NEXT_PUBLIC_R2_BASE_URL:-}
        NEXT_PUBLIC_API_TIMEOUT: ${NEXT_PUBLIC_API_TIMEOUT:-10000}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-mawami}
        NEXT_PUBLIC_ENVIRONMENT: ${NEXT_PUBLIC_ENVIRONMENT:-docker}
    image: mawami-frontend
    restart: unless-stopped
    ports:
      - "${FE_PUBLISH_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  db-data:
